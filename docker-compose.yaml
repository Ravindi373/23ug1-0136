version: "3.8"

services:
  web:
    build: ./web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db
    networks:
      - app-net
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # No host port mapping - only the web container needs to reach MySQL,
    # and it does so over the internal app-net network.
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net
    restart: on-failure

volumes:
  db-data:
    external: true

networks:
  app-net:
    external: true
